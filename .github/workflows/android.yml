name: APK Android (debug)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run cap:build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk KORI.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kori-android-debug
          path: KORI.apk
          if-no-files-found: error
      - name: Publier dans une Release (lien direct .apk)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: KORI — App Android (version de test)
          body: |
            APK de test (debug) à installer sur ton téléphone.
            Téléchargement direct ci-dessous → KORI.apk
          files: KORI.apk
