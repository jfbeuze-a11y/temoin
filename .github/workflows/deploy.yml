name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      # Deux applications séparées depuis un seul code source :
      # /<repo>/ado/  (espace ado)   et   /<repo>/parent/  (espace parent)
      - name: Build ADO
        run: npm run build
        env:
          VITE_SPACE: ado
          VITE_BASE: /${{ github.event.repository.name }}/ado/
          VITE_OUTDIR: dist/ado
      - name: Build PARENT
        run: npm run build
        env:
          VITE_SPACE: parent
          VITE_BASE: /${{ github.event.repository.name }}/parent/
          VITE_OUTDIR: dist/parent

      # Page racine minimale : deux liens (au cas où on ouvre /<repo>/ tout court)
      - name: Page racine
        run: |
          cat > dist/index.html <<'HTML'
          <!doctype html><html lang="fr"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Témoin</title>
          <style>body{font-family:system-ui,sans-serif;background:#14171a;color:#eef2f5;margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}a{display:block;width:280px;max-width:90vw;text-align:center;padding:16px;border-radius:16px;text-decoration:none;font-weight:700}.ado{background:#5ccab6;color:#06231f}.parent{background:#b49cf0;color:#1a1330}h1{font-weight:600}</style>
          </head><body><h1>Témoin</h1>
          <a class="ado" href="./ado/">Espace ado</a>
          <a class="parent" href="./parent/">Espace parent</a>
          </body></html>
          HTML

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
